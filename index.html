<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title"><!-- filled by JS --></title>
  <meta name="description" id="page-meta-description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design tokens (Oviva DE DiGA Styleguide) ─────────── */
    :root {
      /* Accent */
      --color-accent:          #F47F56; /* Accent 1  – coral/orange CTA     */
      --color-accent-hover:    #002926; /* Primary 1 – dark teal on hover   */
      --color-text-on-accent:  #002926; /* Primary 1 – text on coral button */

      /* Text */
      --color-text-primary:    #002926; /* Text 1    – very dark teal       */
      --color-text-secondary:  #6C6C70; /* Text 4    – mid gray             */
      --color-text-on-dark:    #FDF9F3; /* Text 2    – warm white on dark   */

      /* Backgrounds */
      --color-bg-page:         #F6EDDE; /* main page background              */
      --color-bg-section-alt:  #F6EDDE; /* alternate sections – same        */
      --color-bg-trust:        #B4EACC; /* Secondary 4  – light mint green  */
      --color-bg-dark:         #002926; /* Primary 1    – dark teal section */

      /* Neutrals */
      --color-neutral-white:   #FFFFFF; /* Neutral 1 */
      --color-neutral-warm:    #FDF9F3; /* Neutral 2 */
      --color-neutral-dark:    #444446; /* Neutral 5 */
      --color-neutral-border:  #D1D1D5; /* Neutral 10 */

      /* Outline button */
      --color-btn-outline:     #002926; /* Primary 1 – dark teal border/text */

      /* Typography */
      --font-headline:         'DM Serif Display', serif;
      --font-family:           'Inter', sans-serif;

      /* Radii & layout */
      --radius-btn:            999px;
      --radius-card:           16px;
      --max-width:             1120px;
    }

    /* ─── Reset / base ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); color: #002926; background: var(--color-bg-page); line-height: 1.5; }
    h1, h2, h3, h4 { font-family: var(--font-headline); font-weight: 400; color: #002926; }
    img  { max-width: 100%; height: auto; display: block; }
    a    { text-decoration: none; color: inherit; }
    ul   { list-style: none; }

    /* ─── Layout helpers ────────────────────────────────────── */
    .inner       { max-width: var(--max-width); margin: 0 auto; padding: 0 1.25rem; }
    .section     { padding: 4rem 0; }
    .section--sm { padding: 2rem 0; }

    /* ─── Buttons ───────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-btn); font-weight: 700; font-size: 1rem;
      padding: 0.85rem 2.5rem; cursor: pointer; border: 2px solid transparent;
      transition: background .2s, color .2s, border-color .2s, transform .15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--color-accent); color: var(--color-text-on-accent);
      border-color: var(--color-accent);
    }
    .btn-primary:hover {
      background: var(--color-accent-hover); color: var(--color-accent);
      border-color: var(--color-accent-hover);
    }
    .btn-outline {
      background: transparent; color: var(--color-btn-outline);
      border-color: var(--color-btn-outline);
    }
    .btn-outline:hover {
      background: var(--color-btn-outline); color: var(--color-neutral-white);
    }

    /* ─── Top announcement bar ──────────────────────────────── */
    #announcement-bar {
      background: #F6EDDE; color: #002926;
      text-align: center; padding: 0.45rem 1rem;
      font-size: 0.8rem; font-weight: 700;
    }

    /* ─── Header ────────────────────────────────────────────── */
    header {
      background: #FDF9F3; border-bottom: 1px solid var(--color-neutral-border);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      height: 72px;
    }
    .logo img { height: 36px; width: auto; }

    /* ─── Insurance / trust strip ───────────────────────────── */
    #trust-strip {
      background: var(--color-bg-trust); padding: 0.8rem 0;
      font-size: 0.9rem;
    }
    .trust-inner {
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: center; gap: 0.5rem 1.5rem;
    }
    .trust-label  { font-weight: 700; white-space: nowrap; }
    .trust-brands { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.5rem; }
    .trust-brands span { font-weight: 600; white-space: nowrap; }

    /* ─── Hero ──────────────────────────────────────────────── */
    #hero .inner {
      display: flex; flex-direction: column; gap: 2.5rem;
      padding-top: 3rem; padding-bottom: 3rem;
    }
    .hero-text   { display: flex; flex-direction: column; gap: 1rem; }
    .hero-text h1 { font-family: var(--font-headline); font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.1; font-weight: 400; color: #002926; }
    .hero-text h2 { font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-weight: 500; color: #002926; }
    .hero-text p  { font-size: 1.05rem; font-weight: 400; max-width: 560px; color: #002926; }
    .hero-image   { border-radius: var(--radius-card); overflow: hidden; }
    .hero-image img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }

    /* ─── Feature spotlight ─────────────────────────────────── */
    .feature-section .inner {
      display: flex; flex-direction: column; gap: 2rem;
    }
    .feature-section h2 { font-family: var(--font-headline); font-size: clamp(1.5rem, 3.5vw, 2.25rem); font-weight: 400; color: #002926; }
    .feature-section p  { font-size: 1.05rem; color: #002926; }
    .feature-image img  { width: 100%; max-width: 365px; }

    /* ─── Benefits list ─────────────────────────────────────── */
    #benefits { background: var(--color-bg-section-alt); }
    #benefits h2 { font-family: var(--font-headline); font-size: clamp(1.5rem, 3vw, 2.25rem); font-weight: 400; color: #002926; margin-bottom: 2rem; }
    .benefit-list { display: flex; flex-direction: column; gap: 1.5rem; max-width: 560px; margin: 0 auto; }
    .benefit-item { display: flex; gap: 1rem; align-items: flex-start; }
    .benefit-icon {
      flex-shrink: 0; width: 30px; height: 30px; margin-top: 2px;
      color: var(--color-accent);
    }
    .benefit-item h3 { font-size: 1.05rem; margin-bottom: 0.35rem; color: #002926; }
    .benefit-item p  { font-size: 0.95rem; color: #002926; }

    /* ─── App features carousel ─────────────────────────────── */
    #app-features { overflow: hidden; }
    #app-features h2 {
      font-family: var(--font-headline); font-weight: 400; color: #002926;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      text-align: center; margin-bottom: 2rem;
    }
    .carousel-viewport { overflow: hidden; }
    .carousel-track {
      display: flex; gap: 1.25rem;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .carousel-slide {
      flex: 0 0 calc((100% - 2 * 1.25rem) / 3);
      background: none; padding: 0; margin: 0;
      border: none; box-shadow: none; border-radius: 0;
    }
    .carousel-slide img {
      width: 100%; display: block;
      border-radius: 0; box-shadow: none;
      object-fit: contain; aspect-ratio: 9/16;
    }
    .carousel-dots {
      display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.5rem;
    }
    .carousel-dot {
      width: 10px; height: 10px; border-radius: 999px;
      background: #D1D1D5; border: none; cursor: pointer;
      transition: background 0.2s, width 0.2s; padding: 0;
    }
    .carousel-dot.active { background: #002926; width: 28px; }
    @media (max-width: 767px) {
      .carousel-slide { flex: 0 0 80%; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .carousel-slide { flex: 0 0 calc((100% - 1.25rem) / 2); }
    }

    /* ─── Testimonials ──────────────────────────────────────── */
    #testimonials { background: #FDF9F3; }
    #testimonials h2 { font-family: var(--font-headline); font-size: clamp(1.5rem, 3vw, 2.25rem); font-weight: 400; color: #002926; margin-bottom: 2rem; text-align: center; }
    .testimonials-grid { display: flex; flex-direction: column; gap: 1.5rem; }
    .testimonial-card {
      background: #ffffff; border-radius: var(--radius-card);
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
    }
    .testimonial-header { display: flex; align-items: center; gap: 1rem; }
    .testimonial-avatar-wrap { position: relative; flex-shrink: 0; width: 72px; }
    .testimonial-img {
      width: 72px; height: 72px; border-radius: 50%;
      object-fit: cover; object-position: top;
      background: #f0f0f0;
    }
    .testimonial-result {
      position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
      background: #B4EACC; color: #002926;
      font-size: 0.75rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .testimonial-meta { display: flex; flex-direction: column; gap: 0.1rem; }
    .testimonial-name { font-weight: 700; font-size: 1rem; color: #002926; }
    .testimonial-role { font-size: 0.85rem; color: #002926; opacity: 0.7; }
    .testimonial-quote { font-size: 0.95rem; line-height: 1.55; color: #002926; font-style: italic; }

    /* ─── CTA section ───────────────────────────────────────── */
    #final-cta {
      background: #0DCBAA; color: #002926;
      text-align: center; padding: 4rem 1.25rem;
    }
    #final-cta h2 { font-family: var(--font-headline); font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 400; color: #002926; margin-bottom: 2rem; }
    #final-cta .btn-outline { border-color: #002926; color: #002926; }
    #final-cta .btn-outline:hover { background: #002926; color: #0DCBAA; }
    .cta-buttons   { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }

    /* ─── Footer ────────────────────────────────────────────── */
    footer {
      background: var(--color-bg-dark); color: var(--color-text-on-dark);
      padding: 1.5rem 0; font-size: 0.85rem;
    }
    .footer-inner {
      display: flex; flex-wrap: wrap; gap: 0.75rem 2rem;
      justify-content: center; align-items: center;
    }
    .footer-inner a { color: var(--color-text-on-dark); opacity: 0.75; }
    .footer-inner a:hover { opacity: 1; text-decoration: underline; }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (min-width: 768px) {
      #hero .inner           { flex-direction: row; align-items: center; }
      .hero-text             { max-width: 540px; }
      .hero-image            { flex: 1; }
      .feature-section .inner{ flex-direction: row; align-items: center; }
      .feature-text          { flex: 1; }
      .testimonials-grid     { flex-direction: row; }
      .testimonial-card      { flex: 1; }
      #benefits h2           { text-align: center; }
    }

    /* ─── Nutrition Compass section ─────────────────────────── */
    #nutrition-compass {
      background: var(--color-bg-dark);
      color: var(--color-text-on-dark);
      padding: 4rem 0;
    }
    #nutrition-compass .inner {
      display: flex; flex-direction: column; gap: 2.5rem;
    }
    @media (min-width: 820px) {
      #nutrition-compass .inner { flex-direction: row; align-items: center; gap: 3.5rem; }
      .nc-text  { flex: 1.1; }
      .nc-widget-wrap { flex: 0.9; }
    }

    .nc-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--color-bg-dark);
      background: #B4EACC;
      padding: 6px 14px; border-radius: 100px;
      margin-bottom: 18px;
    }
    #nutrition-compass h2 {
      font-family: var(--font-headline);
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 400; line-height: 1.1;
      color: var(--color-text-on-dark);
      margin-bottom: 16px;
    }
    #nutrition-compass h2 em {
      font-style: italic;
      color: #B4EACC;
    }
    #nutrition-compass .nc-lede {
      font-size: 1.05rem; line-height: 1.6;
      color: rgba(253,249,243,0.75);
      max-width: 38ch; margin-bottom: 10px;
    }

    /* Widget card */
    .nc-widget {
      background: #FDF9F3;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 28px 64px -20px rgba(0,0,0,0.45);
      position: relative; overflow: hidden;
    }
    .nc-widget::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(110% 80% at 90% 0%, rgba(244,127,86,0.12), transparent 55%);
      pointer-events: none;
    }
    .nc-widget-tag {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--color-accent);
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 12px;
    }
    .nc-widget h3 {
      font-family: var(--font-headline);
      font-size: 20px; font-weight: 400;
      color: #002926; margin-bottom: 6px;
    }
    .nc-widget p {
      font-size: 14px; color: #6C6C70;
      margin-bottom: 18px;
    }
    .nc-mini-dials {
      display: flex; justify-content: space-between; gap: 4px;
      padding: 14px 10px 10px;
      background: #F6EDDE;
      border-radius: 14px; margin-bottom: 18px;
    }
    .nc-mini-dials .nc-dial-label { font-size: 10px; }
    .nc-mini-dials .nc-dial-status { font-size: 9.5px; }

    /* Widget CTA button — uses existing .btn-primary but overridden here */
    .nc-widget .btn {
      border: none; cursor: pointer;
      font-family: var(--font-family);
      font-weight: 700; font-size: 15px;
      border-radius: var(--radius-btn);
      padding: 14px 22px;
      transition: transform .15s, box-shadow .2s, background .2s;
    }
    .nc-widget .btn:active { transform: scale(0.98); }
    .nc-widget .btn-cta {
      background: var(--color-accent);
      color: var(--color-text-on-accent);
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 10px 22px -8px rgba(244,127,86,0.55);
    }
    .nc-widget .btn-cta:hover { background: var(--color-accent-hover); color: var(--color-accent); }
    .nc-widget .btn:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }

    /* Gauge / dial component */
    .nc-dial { text-align: center; flex: 1; }
    .nc-gauge { width: 100%; max-width: 62px; margin: 0 auto; display: block; }
    .nc-gauge .nc-track { fill: none; stroke: #D1D1D5; stroke-width: 7; stroke-linecap: round; }
    .nc-gauge .nc-arc   { fill: none; stroke-width: 7; stroke-linecap: round; }
    .nc-needle {
      transform-origin: 50px 50px;
      transform: rotate(-90deg);
      transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nc-dial-label  { font-size: 11px; font-weight: 700; margin-top: 3px; color: #002926; }
    .nc-dial-status { font-size: 10px; font-weight: 600; }

    /* Modal overlay */
    .nc-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 41, 38, 0.6);
      backdrop-filter: blur(3px);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 200; opacity: 0;
      transition: opacity 0.25s ease;
    }
    .nc-overlay.open { display: flex; opacity: 1; }

    .nc-modal {
      background: #FDF9F3;
      width: 100%; max-width: 420px; max-height: 94vh;
      border-radius: 24px 24px 0 0;
      overflow-y: auto;
      transform: translateY(24px);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .nc-overlay.open .nc-modal { transform: translateY(0); }
    @media (min-width: 560px) {
      .nc-overlay { align-items: center; padding: 20px; }
      .nc-modal   { border-radius: 24px; max-height: 92vh; }
    }

    .nc-modal-close {
      position: absolute; top: 14px; right: 14px;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.9);
      border: 1px solid #D1D1D5;
      cursor: pointer; font-size: 17px;
      color: #6C6C70;
      display: flex; align-items: center; justify-content: center;
      z-index: 5; line-height: 1;
    }
    .nc-modal-close:hover { color: #002926; }

    .nc-grab {
      width: 38px; height: 4px; border-radius: 4px;
      background: #D1D1D5; margin: 10px auto 0;
    }
    @media (min-width: 560px) { .nc-grab { display: none; } }

    /* Modal screens */
    .nc-screen { display: none; padding: 20px 20px 26px; }
    .nc-screen.active { display: block; animation: nc-fade 0.32s ease; }
    @keyframes nc-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .nc-screen-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--color-accent);
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px;
    }
    .nc-screen h2 {
      font-family: var(--font-headline);
      font-size: 20px; font-weight: 400;
      color: #002926; margin-bottom: 6px;
    }
    .nc-screen .nc-sub { font-size: 13.5px; color: #6C6C70; margin-bottom: 18px; }

    /* Food picker grid */
    .nc-foods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .nc-food {
      border: 1.5px solid #D1D1D5;
      background: #fff;
      border-radius: 16px; padding: 16px 12px;
      cursor: pointer; text-align: center;
      font-family: var(--font-family);
      transition: border-color .18s, transform .15s, box-shadow .2s;
    }
    .nc-food:hover {
      border-color: var(--color-accent);
      box-shadow: 0 8px 20px -12px rgba(244,127,86,0.5);
      transform: translateY(-2px);
    }
    .nc-food:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
    .nc-food .nc-food-img {
      width: 100%; height: 90px;
      object-fit: cover; border-radius: 10px;
      display: block; margin-bottom: 10px;
    }
    .nc-food .nc-name { font-weight: 700; font-size: 14px; color: #002926; }
    .nc-food .nc-desc { font-size: 12px; color: #6C6C70; margin-top: 2px; }

    /* Loading screen */
    .nc-loader-wrap { text-align: center; padding: 40px 10px 36px; }
    .nc-compass-anim {
      width: 88px; height: 88px;
      margin: 0 auto 22px; position: relative;
    }
    .nc-compass-anim .nc-ring {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid #B4EACC;
      box-shadow: inset 0 0 0 6px #fff;
    }
    .nc-compass-anim .nc-spin {
      position: absolute; inset: 0;
      animation: nc-spin 1.15s cubic-bezier(0.5,0,0.5,1) infinite;
    }
    @keyframes nc-spin { to { transform: rotate(360deg); } }
    .nc-compass-anim .nc-spin svg { width: 100%; height: 100%; }
    .nc-loader-msg { font-size: 15px; font-weight: 600; color: #002926; min-height: 22px; }
    .nc-loader-sub { font-size: 13px; color: #6C6C70; margin-top: 4px; }

    /* Result screen */
    .nc-result-photo {
      height: 140px; border-radius: 14px;
      overflow: hidden; margin-bottom: 14px;
    }
    .nc-result-photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .nc-result-desc-label { font-weight: 700; font-size: 14px; color: #002926; margin-bottom: 8px; }
    .nc-result-desc {
      list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
    }
    .nc-result-desc li {
      font-size: 12.5px; color: #6C6C70;
      background: #F6EDDE; border-radius: 100px;
      padding: 4px 11px;
    }
    .nc-feedback-label { font-weight: 700; font-size: 14px; color: #002926; margin-bottom: 10px; }
    .nc-dials-row {
      display: flex; justify-content: space-between; gap: 4px;
      padding-bottom: 4px; margin-bottom: 18px;
    }

    /* AI nudge card */
    .nc-nudge {
      background: #FEF0EA;
      border-radius: 16px; padding: 16px;
      margin-bottom: 20px; position: relative;
    }
    .nc-nudge-head {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 700;
      color: var(--color-accent); margin-bottom: 7px;
      letter-spacing: 0.01em;
    }
    .nc-nudge-body { font-size: 14px; line-height: 1.55; color: #002926; }
    .nc-nudge-body strong { color: var(--color-accent); font-weight: 700; }

    .nc-cta-note {
      text-align: center; font-size: 12px;
      color: #6C6C70; margin-top: 8px;
    }
    .nc-cta-note a {
      color: #002926; text-decoration: underline; cursor: pointer;
    }

    .nc-restart {
      background: none; border: none; cursor: pointer;
      font-family: var(--font-family); font-size: 13.5px; font-weight: 600;
      color: #6C6C70; margin-top: 4px;
      display: flex; align-items: center; gap: 5px; padding: 6px 0;
    }
    .nc-restart:hover { color: #002926; }

    @media (prefers-reduced-motion: reduce) {
      .nc-needle         { transition: none !important; }
      .nc-compass-anim .nc-spin { animation: none !important; }
    }
  </style>
</head>
<body>

<script>
const CONTENT = {

<script>
(function render() {
  const c = CONTENT;

  /* Meta */
  document.title = c.pageTitle;
  document.getElementById('page-title').textContent = c.pageTitle;
  document.getElementById('page-meta-description').setAttribute('content', c.metaDescription);

  /* Announcement */
  document.getElementById('announcement-bar').textContent = c.announcement;

  /* Header */
  document.getElementById('logo-img').src   = c.logoSrc;
  document.getElementById('logo-img').alt   = c.logoAlt;
  document.getElementById('nav-cta').textContent = c.navCtaLabel;
  document.getElementById('nav-cta').href   = c.navCtaHref;

  /* Trust strip */
  document.getElementById('trust-label').textContent = c.trustLabel;
  document.getElementById('trust-brands').innerHTML  =
    c.trustBrands.map(b => `<span>${b}</span>`).join('');

  /* Hero */
  document.getElementById('hero-headline').textContent    = c.heroHeadline;
  document.getElementById('hero-cta').textContent         = c.heroCtaLabel;
  document.getElementById('hero-cta').href                = c.heroCtaHref;
  document.getElementById('hero-image').src               = c.heroImageSrc;
  document.getElementById('hero-image').alt               = c.heroImageAlt;

  /* Feature spotlight */
  document.getElementById('feature-headline').textContent = c.featureHeadline;
  document.getElementById('feature-body').textContent     = c.featureBody;
  document.getElementById('feature-cta').textContent      = c.featureCtaLabel;
  document.getElementById('feature-cta').href             = c.featureCtaHref;
  document.getElementById('feature-image').src            = c.featureImageSrc;
  document.getElementById('feature-image').alt            = c.featureImageAlt;

  /* Benefits */
  document.getElementById('benefits-headline').textContent = c.benefitsHeadline;
  document.getElementById('benefits-list').innerHTML =
    c.benefits.map(b => `
      <li class="benefit-item">
        <svg class="benefit-icon" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.707 5.707a1 1 0 0 0-1.414 0l-.35.35a1 1 0 0 0 0 1.415L19.212 13.75H5.375a.875.875 0 0 0-.875.875v.75c0 .483.392.875.875.875h13.837l-6.279 6.268a1 1 0 0 0 0 1.414l.36.36a1 1 0 0 0 1.414 0l8.586-8.586a1 1 0 0 0 0-1.414L15.707 5.707Z" fill="currentColor"/>
        </svg>
        <div>
          <h3>${b.title}</h3>
          <p>${b.body}</p>
        </div>
      </li>`).join('');
  document.getElementById('benefits-cta').textContent = c.benefitsCtaLabel;
  document.getElementById('benefits-cta').href        = c.benefitsCtaHref;

  /* App features carousel */
  document.getElementById('app-features-headline').textContent = c.appFeaturesHeadline;
  const track = document.getElementById('carousel-track');
  const dotsEl = document.getElementById('carousel-dots');
  track.innerHTML = c.appSlides.map(s =>
    `<div class="carousel-slide"><h3>${s.title}</h3><img src="${s.img}" alt="${s.title}" /></div>`
  ).join('');
  dotsEl.innerHTML = c.appSlides.map((_, i) =>
    `<button class="carousel-dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="Slide ${i+1}"></button>`
  ).join('');

  (function initCarousel() {
    const slides     = track.querySelectorAll('.carousel-slide');
    const dots       = dotsEl.querySelectorAll('.carousel-dot');
    const visible    = () => window.innerWidth < 768 ? 1 : window.innerWidth < 1024 ? 2 : 3;
    let current      = 0;
    let timer;

    function goTo(idx) {
      const max = slides.length - visible();
      current = Math.max(0, Math.min(idx, max));
      const slideW = slides[0].offsetWidth + 20; /* 20 = gap in px */
      track.style.transform = `translateX(-${current * slideW}px)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }

    function next() { goTo(current >= slides.length - visible() ? 0 : current + 1); }

    function startAuto() { timer = setInterval(next, c.carouselAutoplayMs); }
    function stopAuto()  { clearInterval(timer); }

    dots.forEach(d => d.addEventListener('click', () => { stopAuto(); goTo(+d.dataset.i); startAuto(); }));

    /* Pause on hover */
    track.closest('.carousel-viewport').addEventListener('mouseenter', stopAuto);
    track.closest('.carousel-viewport').addEventListener('mouseleave', startAuto);

    /* Recalculate on resize */
    window.addEventListener('resize', () => goTo(current));

    startAuto();
  })();

  /* Testimonials */
  document.getElementById('testimonials-headline').textContent = c.testimonialsHeadline;
  document.getElementById('testimonials-grid').innerHTML =
    c.testimonials.map(t => `
      <div class="testimonial-card">
        <div class="testimonial-header">
          <div class="testimonial-avatar-wrap">
            <img class="testimonial-img" src="${c.testimonialImageSrc}" alt="${c.testimonialImageAlt}" />
            <span class="testimonial-result">${t.result}</span>
          </div>
          <div class="testimonial-meta">
            <span class="testimonial-name">${t.name}</span>
            <span class="testimonial-role">${t.role}</span>
          </div>
        </div>
        <p class="testimonial-quote">„${t.quote}"</p>
      </div>`).join('');

  /* Final CTA */
  document.getElementById('final-cta-headline').textContent = c.finalCtaHeadline;
  document.getElementById('final-cta-buttons').innerHTML =
    c.finalCtas.map(b => `<a class="btn ${b.style}" href="${b.href}">${b.label}</a>`).join('');

  /* Footer */
  document.getElementById('footer-links').innerHTML =
    c.footerLinks.map(l => `<a href="${l.href}">${l.label}</a>`).join('');
})();
</script>

<script>
/* ── Nutrition Compass ──────────────────────────────────────── */
(function initCompass() {
  const c = CONTENT;

  /* Status config using Oviva palette */
  const STATUS = {
    low:  { label: c.compassStatusLabels.low,  color: "#F47F56", angle: -52 },
    good: { label: c.compassStatusLabels.good, color: "#0DCBAA", angle: 0   },
    high: { label: c.compassStatusLabels.high, color: "#E05C3A", angle: 52  }
  };

  /* Build gauge SVG */
  function gauge(status, animate) {
    const s = STATUS[status];
    const startAngle = animate ? -90 : s.angle;
    return `
      <svg class="nc-gauge" viewBox="0 0 100 62" role="img" aria-label="${s.label}">
        <path class="nc-track" d="M12,50 A38,38 0 0 1 88,50"/>
        <line class="nc-needle" x1="50" y1="50" x2="50" y2="16"
              stroke="${s.color}" stroke-width="4.5" stroke-linecap="round"
              style="transform-origin:50px 50px;transform:rotate(${startAngle}deg)"/>
        <circle cx="50" cy="50" r="4.5" fill="${s.color}"/>
      </svg>`;
  }

  function dialBlock(nutrient, status, animate, mini) {
    const s = STATUS[status];
    const labelClass  = mini ? "nc-dial-label"  : "nc-dial-label";
    const statusClass = mini ? "nc-dial-status" : "nc-dial-status";
    return `
      <div class="nc-dial" data-status="${status}">
        ${gauge(status, animate)}
        <div class="${labelClass}">${nutrient}</div>
        <div class="${statusClass}" style="color:${s.color}">${s.label}</div>
      </div>`;
  }

  /* Static section copy */
  document.getElementById("nc-eyebrow").textContent     = c.compassEyebrow;
  document.getElementById("nc-headline").innerHTML      = c.compassHeadline
    .replace("Keine guten Lebensmittel. Keine schlechten.", "Keine guten Lebensmittel.<br>Keine schlechten.")
    .replace("Nur Balance.", "<em>Nur Balance.</em>");
  document.getElementById("nc-lede").textContent        = c.compassBody;
  document.getElementById("nc-widget-tag").textContent  = c.compassWidgetTag;
  document.getElementById("nc-widget-title").textContent= c.compassWidgetTitle;
  document.getElementById("nc-widget-desc").textContent = c.compassWidgetDesc;

  const openBtn = document.getElementById("nc-open-demo");
  openBtn.textContent = c.compassOpenLabel;
  openBtn.insertAdjacentHTML("beforeend", ' <span aria-hidden="true">→</span>');

  /* Mini-dials preview */
  document.getElementById("nc-mini-dials").innerHTML =
    c.compassNutrients.map((n, i) => dialBlock(n, c.compassPreviewStatuses[i], false, true)).join("");

  /* Food grid */
  document.getElementById("nc-pick-title").textContent = c.compassWidgetTitle;
  document.getElementById("nc-pick-sub").textContent   = c.compassWidgetDesc;
  document.getElementById("nc-food-grid").innerHTML    = Object.entries(c.compassMeals).map(([key, m]) => `
    <button class="nc-food" data-meal="${key}" aria-label="${m.name} wählen">
      <img class="nc-food-img" src="${m.img}" alt="${m.name}" loading="lazy" />
      <span class="nc-name">${m.name}</span>
      <span class="nc-desc">${m.short}</span>
    </button>`).join("");

  /* Static modal labels */
  document.getElementById("nc-loader-sub").textContent       = c.compassLoaderSub;
  document.getElementById("nc-result-meal-label").textContent= c.compassResultMealLabel;
  document.getElementById("nc-feedback-label").textContent   = c.compassFeedbackLabel;
  document.getElementById("nc-nudge-head").textContent       = c.compassNudgeHead;
  const funnelBtn = document.getElementById("nc-start-funnel");
  funnelBtn.textContent = c.compassFunnelLabel;
  funnelBtn.insertAdjacentHTML("beforeend", ' <span aria-hidden="true">→</span>');
  document.getElementById("nc-cta-note").innerHTML =
    c.compassCtaNote + `<a id="nc-try-another">${c.compassTryAnother}</a>`;

  /* Modal open/close */
  const overlay = document.getElementById("nc-overlay");
  const modal   = document.getElementById("nc-modal");

  function ncShow(id) {
    document.querySelectorAll(".nc-screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    modal.scrollTop = 0;
  }
  function ncOpen()  { overlay.classList.add("open"); ncShow("nc-screen-pick"); document.body.style.overflow = "hidden"; }
  function ncClose() { overlay.classList.remove("open"); document.body.style.overflow = ""; }

  openBtn.addEventListener("click", ncOpen);
  document.getElementById("nc-close-demo").addEventListener("click", ncClose);
  overlay.addEventListener("click", e => { if (e.target === overlay) ncClose(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") ncClose(); });

  /* Food pick → loading → result */
  document.querySelectorAll(".nc-food").forEach(btn => {
    btn.addEventListener("click", () => runResult(btn.dataset.meal));
  });

  function runResult(key) {
    const meal = c.compassMeals[key];
    ncShow("nc-screen-loading");

    const msgEl = document.getElementById("nc-loader-msg");
    let i = 0; msgEl.textContent = c.compassLoaderMsgs[0];
    const cycle = setInterval(() => {
      i++; if (i < c.compassLoaderMsgs.length) msgEl.textContent = c.compassLoaderMsgs[i];
    }, 620);

    setTimeout(() => {
      clearInterval(cycle);
      renderResult(meal);
      ncShow("nc-screen-result");
    }, 1900);
  }

  function renderResult(meal) {
    document.getElementById("nc-result-photo").innerHTML = `<img src="${meal.img}" alt="${meal.name}" />`;
    document.getElementById("nc-result-desc").innerHTML =
      meal.desc.map(d => `<li>${d}</li>`).join("");
    document.getElementById("nc-result-dials").innerHTML =
      c.compassNutrients.map(n => dialBlock(n, meal.dials[n], true, false)).join("");
    document.getElementById("nc-nudge-body").innerHTML = meal.nudge;

    requestAnimationFrame(() => {
      document.querySelectorAll("#nc-result-dials .nc-needle").forEach((needle, idx) => {
        const status = needle.closest(".nc-dial").dataset.status;
        const target = STATUS[status].angle;
        setTimeout(() => { needle.style.transform = `rotate(${target}deg)`; }, 120 + idx * 130);
      });
    });
  }

  /* Try another / funnel */
  document.getElementById("nc-cta-note").addEventListener("click", e => {
    if (e.target.id === "nc-try-another") ncShow("nc-screen-pick");
  });
  funnelBtn.addEventListener("click", () => {
    window.location.href = "https://start.oviva.com/ui/bmi_first";
  });
})();
</script>

</body>
</html>
